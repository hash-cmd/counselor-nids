<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1900" viewBox="0 0 1720 1900" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5263"/></marker></defs><rect width="1720" height="1900" fill="#FFFFFF"/><text x="40" y="51.1" font-size="26" font-weight="bold" fill="#1C2433" text-anchor="start">Counselor NIDS — what happens to each connection</text><text x="40" y="79.2" font-size="15" font-weight="normal" fill="#5B6475" text-anchor="start">The AI and Snort judge the same traffic in parallel; where they agree, the detectors learn (thesis addition, bottom).</text><rect x="40" y="99" width="18" height="18" rx="4" fill="#EAF1FF" stroke="#3566C8" stroke-width="2"/><text x="66" y="112.5" font-size="13" font-weight="normal" fill="#5B6475" text-anchor="start">AI detectors</text><rect x="230" y="99" width="18" height="18" rx="4" fill="#FFF1E3" stroke="#CF7A22" stroke-width="2"/><text x="256" y="112.5" font-size="13" font-weight="normal" fill="#5B6475" text-anchor="start">Rule checker (Snort)</text><rect x="420" y="99" width="18" height="18" rx="4" fill="#FFF9E3" stroke="#B8901A" stroke-width="2"/><text x="446" y="112.5" font-size="13" font-weight="normal" fill="#5B6475" text-anchor="start">Decision</text><rect x="610" y="99" width="18" height="18" rx="4" fill="#E8F6EC" stroke="#2C9152" stroke-width="2"/><text x="636" y="112.5" font-size="13" font-weight="normal" fill="#5B6475" text-anchor="start">Result</text><rect x="800" y="99" width="18" height="18" rx="4" fill="#FDEEF5" stroke="#B83A78" stroke-width="2"/><text x="826" y="112.5" font-size="13" font-weight="normal" fill="#5B6475" text-anchor="start">Thesis additions</text><rect x="620" y="140" width="480" height="64" rx="10" fill="#22304A" stroke="#22304A" stroke-width="2"/><text x="860.0" y="177.6" font-size="16" font-weight="normal" fill="#FFFFFF" text-anchor="middle">Packets arrive on the network interface</text><path d="M760,204 L760,230 L520,230 L520,260" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><path d="M960,204 L960,230 L1330,230 L1330,260" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><text x="506" y="250.6" font-size="13" font-weight="bold" fill="#3566C8" text-anchor="end">AI path</text><text x="1344" y="250.6" font-size="13" font-weight="bold" fill="#CF7A22" text-anchor="start">Snort path</text><rect x="290" y="260" width="460" height="84" rx="10" fill="#EAF1FF" stroke="#3566C8" stroke-width="2"/><text x="520.0" y="297.8" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">The flow meter groups packets into a connection;</text><text x="520.0" y="316.0" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">it ends on FIN, after 240 s idle, or at ~2 minutes long</text><path d="M520,344 L520,372" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><polygon points="520,372 670,432 520,492 370,432" fill="#FFF9E3" stroke="#B8901A" stroke-width="2"/><text x="520" y="427.8" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">Did it carry</text><text x="520" y="446.0" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">any data?</text><rect x="40" y="397" width="210" height="100" rx="10" fill="#FFFFFF" stroke="#9AA1AE" stroke-width="2"/><text x="145.0" y="434.7" font-size="13" font-weight="normal" fill="#1C2433" text-anchor="middle">Not sent to the AI</text><text x="145.0" y="451.6" font-size="13" font-weight="normal" fill="#1C2433" text-anchor="middle">(scans, failed connections);</text><text x="145.0" y="468.5" font-size="13" font-weight="normal" fill="#1C2433" text-anchor="middle">Snort still sees it</text><path d="M370,432 L250,432" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><rect x="308.0" y="407.5" width="24.0" height="20.25" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="320" y="422.4" font-size="12.5" font-weight="normal" fill="#5B6475" text-anchor="middle">no</text><path d="M520,492 L520,530" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><rect x="537" y="499.5" width="31.000000000000004" height="20.25" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="542" y="514.4" font-size="12.5" font-weight="normal" fill="#5B6475" text-anchor="start">yes</text><rect x="290" y="530" width="460" height="84" rx="10" fill="#EAF1FF" stroke="#3566C8" stroke-width="2"/><text x="520.0" y="567.8" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">Each detector: K-Means puts the connection in a cluster,</text><text x="520.0" y="586.0" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">and that cluster&#x27;s best classifiers vote</text><path d="M520,614 L520,642" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><polygon points="520,642 670,702 520,762 370,702" fill="#FFF9E3" stroke="#B8901A" stroke-width="2"/><text x="520" y="697.8" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">Do the classifiers</text><text x="520" y="716.0" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">agree?</text><rect x="40" y="672" width="210" height="60" rx="10" fill="#EAF1FF" stroke="#3566C8" stroke-width="2"/><text x="145.0" y="706.7" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle">Unanimous verdict</text><path d="M370,702 L250,702" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><rect x="304.5" y="677.5" width="31.000000000000004" height="20.25" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="320" y="692.4" font-size="12.5" font-weight="normal" fill="#5B6475" text-anchor="middle">yes</text><path d="M520,762 L520,800" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><rect x="527" y="770.5" width="94.00000000000001" height="20.25" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="532" y="785.4" font-size="12.5" font-weight="normal" fill="#5B6475" text-anchor="start">no: conflict</text><rect x="290" y="800" width="460" height="70" rx="10" fill="#EAF1FF" stroke="#3566C8" stroke-width="2"/><text x="520.0" y="830.8" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">Ask the counselors for advice:</text><text x="520.0" y="849.0" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">the other detectors, and Snort (thesis)</text><path d="M520,870 L520,898" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><polygon points="520,898 690,960 520,1022 350,960" fill="#FFF9E3" stroke="#B8901A" stroke-width="2"/><text x="520" y="956.0" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle">Trusted advice?</text><text x="520" y="973.5" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle">(counselor trust ≥ 90%)</text><rect x="790" y="925" width="220" height="70" rx="10" fill="#EAF1FF" stroke="#3566C8" stroke-width="2"/><text x="900.0" y="956.0" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle">No help: best guess,</text><text x="900.0" y="973.5" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle">counted as normal</text><path d="M690,960 L790,960" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><rect x="723.0" y="935.5" width="24.0" height="20.25" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="735" y="950.4" font-size="12.5" font-weight="normal" fill="#5B6475" text-anchor="middle">no</text><path d="M520,1022 L520,1058" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><rect x="537" y="1029.5" width="31.000000000000004" height="20.25" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="542" y="1044.4" font-size="12.5" font-weight="normal" fill="#5B6475" text-anchor="start">yes</text><rect x="370" y="1058" width="300" height="56" rx="10" fill="#EAF1FF" stroke="#3566C8" stroke-width="2"/><text x="520.0" y="1090.7" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle">Take the counselor&#x27;s verdict</text><path d="M145,732 L145,1180 L370,1180" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><path d="M520,1114 L520,1130" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><path d="M900,995 L900,1180 L670,1180" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><polygon points="520,1130 670,1180 520,1230 370,1180" fill="#FFF9E3" stroke="#B8901A" stroke-width="2"/><text x="520" y="1175.8" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">Verdict is</text><text x="520" y="1194.0" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">“normal”?</text><path d="M520,1230 L520,1268" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><rect x="537" y="1238.5" width="31.000000000000004" height="20.25" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="542" y="1253.4" font-size="12.5" font-weight="normal" fill="#5B6475" text-anchor="start">yes</text><polygon points="520,1268 720,1330 520,1392 320,1330" fill="#FFF9E3" stroke="#B8901A" stroke-width="2"/><text x="520" y="1326.1" font-size="13" font-weight="normal" fill="#1C2433" text-anchor="middle">Cross-check: does another</text><text x="520" y="1343.0" font-size="13" font-weight="normal" fill="#1C2433" text-anchor="middle">detector, or Snort, see an attack?</text><rect x="790" y="1300" width="220" height="60" rx="10" fill="#FFFFFF" stroke="#9AA1AE" stroke-width="2"/><text x="900.0" y="1334.7" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle">Normal: no alert</text><path d="M720,1330 L790,1330" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><rect x="723.0" y="1305.5" width="24.0" height="20.25" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="735" y="1320.4" font-size="12.5" font-weight="normal" fill="#5B6475" text-anchor="middle">no</text><path d="M520,1392 L520,1440" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><rect x="537" y="1405.5" width="31.000000000000004" height="20.25" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="542" y="1420.4" font-size="12.5" font-weight="normal" fill="#5B6475" text-anchor="start">yes</text><path d="M445,1205 L230,1205 L230,1476 L290,1476" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><rect x="204.0" y="1311.0" width="52.00000000000001" height="36.5" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="230" y="1326.2" font-size="12.5" font-weight="normal" fill="#5B6475" text-anchor="middle">no:</text><text x="230" y="1342.5" font-size="12.5" font-weight="normal" fill="#5B6475" text-anchor="middle">attack</text><rect x="290" y="1440" width="460" height="72" rx="10" fill="#EAF1FF" stroke="#3566C8" stroke-width="2"/><text x="520.0" y="1471.8" font-size="14" font-weight="bold" fill="#1C2433" text-anchor="middle">AI alert</text><text x="520.0" y="1490.0" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">attack if any detector says attack</text><rect x="1110" y="260" width="440" height="84" rx="10" fill="#FFF1E3" stroke="#CF7A22" stroke-width="2"/><text x="1330.0" y="297.8" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">Snort 3 inspects the same packets:</text><text x="1330.0" y="316.0" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">protocol inspectors + project and community rules</text><path d="M1330,344 L1330,372" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><polygon points="1330,372 1480,432 1330,492 1180,432" fill="#FFF9E3" stroke="#B8901A" stroke-width="2"/><text x="1330" y="427.8" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">Does a rule</text><text x="1330" y="446.0" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">match?</text><rect x="1540" y="407" width="150" height="50" rx="10" fill="#FFFFFF" stroke="#9AA1AE" stroke-width="2"/><text x="1615.0" y="436.7" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle">No alert</text><path d="M1480,432 L1540,432" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><rect x="1498.0" y="407.5" width="24.0" height="20.25" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="1510" y="422.4" font-size="12.5" font-weight="normal" fill="#5B6475" text-anchor="middle">no</text><path d="M1330,492 L1330,530" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><rect x="1347" y="499.5" width="31.000000000000004" height="20.25" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="1352" y="514.4" font-size="12.5" font-weight="normal" fill="#5B6475" text-anchor="start">yes</text><rect x="1110" y="530" width="440" height="110" rx="10" fill="#FFF1E3" stroke="#CF7A22" stroke-width="2"/><text x="1330.0" y="563.4" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle">Link the alert to its connection:</text><text x="1330.0" y="580.9" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle">same addresses, ports, protocol and time</text><text x="1330.0" y="598.5" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle">(port scan: every connection between</text><text x="1330.0" y="616.0" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle">the two hosts within ±30 s)</text><path d="M1330,640 L1330,670" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><rect x="1110" y="670" width="440" height="70" rx="10" fill="#FFF1E3" stroke="#CF7A22" stroke-width="2"/><text x="1330.0" y="701.0" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle">Ask the AI detectors for their verdict</text><text x="1330.0" y="718.5" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle">on that connection</text><path d="M1330,740 L1330,770" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><polygon points="1330,770 1480,830 1330,890 1180,830" fill="#FFF9E3" stroke="#B8901A" stroke-width="2"/><text x="1330" y="825.8" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">Does the AI</text><text x="1330" y="844.0" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">say attack?</text><rect x="1100" y="940" width="200" height="70" rx="10" fill="#E8F6EC" stroke="#2C9152" stroke-width="2"/><text x="1200.0" y="971.0" font-size="13.5" font-weight="bold" fill="#1C2433" text-anchor="middle">Confirmed</text><text x="1200.0" y="988.5" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle">Snort + AI agree</text><rect x="1360" y="940" width="200" height="70" rx="10" fill="#E8F6EC" stroke="#2C9152" stroke-width="2"/><text x="1460.0" y="971.0" font-size="13.5" font-weight="bold" fill="#1C2433" text-anchor="middle">Disputed</text><text x="1460.0" y="988.5" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle">Snort only</text><path d="M1260,870 L1200,940" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><rect x="1196.5" y="889.5" width="31.000000000000004" height="20.25" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="1212" y="904.4" font-size="12.5" font-weight="normal" fill="#5B6475" text-anchor="middle">yes</text><path d="M1400,870 L1460,940" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><rect x="1436.0" y="889.5" width="24.0" height="20.25" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="1448" y="904.4" font-size="12.5" font-weight="normal" fill="#5B6475" text-anchor="middle">no</text><rect x="1440" y="1060" width="270" height="150" rx="10" fill="#FFFFFF" stroke="#9AA1AE" stroke-width="2"/><text x="1575.0" y="1105.8" font-size="13" font-weight="normal" fill="#1C2433" text-anchor="middle">A disputed alert is either</text><text x="1575.0" y="1122.7" font-size="13" font-weight="normal" fill="#1C2433" text-anchor="middle">a Snort false alarm, or an</text><text x="1575.0" y="1139.5" font-size="13" font-weight="normal" fill="#1C2433" text-anchor="middle">attack the AI never learned</text><text x="1575.0" y="1156.5" font-size="13" font-weight="normal" fill="#1C2433" text-anchor="middle">(e.g. SQL injection looks like</text><text x="1575.0" y="1173.3" font-size="13" font-weight="normal" fill="#1C2433" text-anchor="middle">ordinary web traffic to the AI)</text><path d="M1510,1010 L1510,1060" fill="none" stroke="#4A5263" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#head)"/><path d="M1200,1010 L1200,1570" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><path d="M1400,1010 L1400,1570" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><path d="M750,1476 L1060,1476 L1060,705 L1110,705" fill="none" stroke="#4A5263" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#head)"/><rect x="1006.0" y="1102.5" width="108.00000000000001" height="52.75" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="1060" y="1118.1" font-size="12.5" font-weight="normal" fill="#5B6475" text-anchor="middle">AI verdicts</text><text x="1060" y="1134.4" font-size="12.5" font-weight="normal" fill="#5B6475" text-anchor="middle">answer Snort&#x27;s</text><text x="1060" y="1150.6" font-size="12.5" font-weight="normal" fill="#5B6475" text-anchor="middle">question</text><path d="M520,1512 L520,1570" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><rect x="396.0" y="1530.5" width="248.00000000000003" height="20.25" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="520" y="1545.4" font-size="12.5" font-weight="normal" fill="#5B6475" text-anchor="middle">AI only, unless Snort also alerted</text><rect x="290" y="1570" width="1300" height="76" rx="10" fill="#E8F6EC" stroke="#2C9152" stroke-width="2"/><text x="940.0" y="1603.8" font-size="14" font-weight="bold" fill="#1C2433" text-anchor="middle">Dashboard incident</text><text x="940.0" y="1622.0" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">Confirmed · Disputed · AI only — with a severity, a plain explanation and the attacker&#x27;s other activity</text><path d="M940,1646 L940,1676" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><rect x="290" y="1676" width="1300" height="60" rx="10" fill="#E8F6EC" stroke="#2C9152" stroke-width="2"/><text x="940.0" y="1710.9" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">Alert journal (logs/journal/): false alarms per 1,000 connections, leaving out your marked attack tests</text><path d="M940,1736 L940,1772" fill="none" stroke="#B83A78" stroke-width="2" marker-end="url(#head)"/><rect x="290" y="1772" width="1300" height="96" rx="10" fill="#FDEEF5" stroke="#B83A78" stroke-width="2"/><text x="940.0" y="1807.2" font-size="13.5" font-weight="bold" fill="#1C2433" text-anchor="middle">Thesis: learning from agreement on a new network</text><text x="940.0" y="1824.7" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle">agreement labels (Snort and the AI independently say attack; or Snort silent and every detector sure it&#x27;s normal)</text><text x="940.0" y="1842.3" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle">→ adaptive trust (each detector cluster, each Snort rule) → detectors retrain behind a label-free gate</text><path d="M290,1820 L22,1820 L22,572 L290,572" fill="none" stroke="#B83A78" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#head)"/><rect x="80.44" y="1809.84" width="151.12" height="19.6" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="156" y="1824.2" font-size="12" font-weight="normal" fill="#B83A78" text-anchor="middle">updates the detectors</text></svg>