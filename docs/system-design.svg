<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5263"/></marker></defs><rect width="1600" height="1060" fill="#FFFFFF"/><text x="40" y="51.1" font-size="26" font-weight="bold" fill="#1C2433" text-anchor="start">Counselor NIDS — system design</text><text x="40" y="79.2" font-size="15" font-weight="normal" fill="#5B6475" text-anchor="start">Two independent checks watch the same traffic; every Snort alert is matched to the AI&#x27;s verdict on that connection.</text><rect x="40" y="99" width="18" height="18" rx="4" fill="#EAF1FF" stroke="#3566C8" stroke-width="2"/><text x="66" y="112.5" font-size="13" font-weight="normal" fill="#5B6475" text-anchor="start">AI (machine learning)</text><rect x="245" y="99" width="18" height="18" rx="4" fill="#FFF1E3" stroke="#CF7A22" stroke-width="2"/><text x="271" y="112.5" font-size="13" font-weight="normal" fill="#5B6475" text-anchor="start">Rule checker (Snort)</text><rect x="450" y="99" width="18" height="18" rx="4" fill="#F1F2F4" stroke="#7B8190" stroke-width="2"/><text x="476" y="112.5" font-size="13" font-weight="normal" fill="#5B6475" text-anchor="start">Message bus</text><rect x="655" y="99" width="18" height="18" rx="4" fill="#E8F6EC" stroke="#2C9152" stroke-width="2"/><text x="681" y="112.5" font-size="13" font-weight="normal" fill="#5B6475" text-anchor="start">API, dashboard, records</text><rect x="860" y="99" width="18" height="18" rx="4" fill="#F4EEFA" stroke="#7E55B8" stroke-width="2"/><text x="886" y="112.5" font-size="13" font-weight="normal" fill="#5B6475" text-anchor="start">Offline and operations</text><rect x="40" y="380" width="190" height="130" rx="10" fill="#22304A" stroke="#22304A" stroke-width="2"/><text x="135.0" y="430.8" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Your network</text><text x="135.0" y="450.2" font-size="15" font-weight="normal" fill="#FFFFFF" text-anchor="middle">interface</text><text x="135.0" y="469.8" font-size="15" font-weight="normal" fill="#FFFFFF" text-anchor="middle">wlan0 · eth0</text><rect x="300" y="160" width="250" height="160" rx="10" fill="#EAF1FF" stroke="#3566C8" stroke-width="2"/><text x="425.0" y="208.5" font-size="14" font-weight="bold" fill="#1C2433" text-anchor="middle">Traffic capture</text><text x="425.0" y="226.7" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">nids extract</text><text x="425.0" y="244.9" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">Python cicflowmeter:</text><text x="425.0" y="263.1" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">packets → connections</text><text x="425.0" y="281.3" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">(empty ones skip the AI)</text><rect x="615" y="180" width="180" height="120" rx="10" fill="#EAF1FF" stroke="#3566C8" stroke-width="2"/><text x="705.0" y="226.7" font-size="14" font-weight="bold" fill="#1C2433" text-anchor="middle">Observer</text><text x="705.0" y="244.9" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">routes connections</text><text x="705.0" y="263.1" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">to every detector</text><rect x="860" y="135" width="350" height="280" rx="14" fill="none" stroke="#3566C8" stroke-width="1.6" stroke-dasharray="7 5"/><rect x="874" y="124" width="245.2" height="22" rx="4" fill="#FFFFFF"/><text x="882" y="139.6" font-size="13" font-weight="bold" fill="#3566C8" text-anchor="start">AI detectors · counselor network</text><rect x="880" y="160" width="310" height="62" rx="10" fill="#EAF1FF" stroke="#3566C8" stroke-width="2"/><text x="1035.0" y="186.9" font-size="13.5" font-weight="bold" fill="#1C2433" text-anchor="middle">Flood detector</text><text x="1035.0" y="204.5" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle">DoS: GoldenEye, Hulk, Slowloris…</text><rect x="880" y="245" width="310" height="62" rx="10" fill="#EAF1FF" stroke="#3566C8" stroke-width="2"/><text x="1035.0" y="272.0" font-size="13.5" font-weight="bold" fill="#1C2433" text-anchor="middle">Break-in detector</text><text x="1035.0" y="289.5" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle">FTP/SSH guessing, web attacks</text><path d="M1035,224 L1035,243" fill="none" stroke="#4A5263" stroke-width="2" marker-start="url(#head)" marker-end="url(#head)"/><rect x="880" y="330" width="310" height="62" rx="10" fill="#EAF1FF" stroke="#3566C8" stroke-width="2"/><text x="1035.0" y="357.0" font-size="13.5" font-weight="bold" fill="#1C2433" text-anchor="middle">Botnet detector</text><text x="1035.0" y="374.5" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle">infected hosts calling their C2</text><path d="M1035,309 L1035,328" fill="none" stroke="#4A5263" stroke-width="2" marker-start="url(#head)" marker-end="url(#head)"/><text x="1035" y="405.4" font-size="12.5" font-weight="normal" fill="#3566C8" text-anchor="middle">ask each other for advice · double-check verdicts</text><rect x="300" y="450" width="910" height="66" rx="10" fill="#F1F2F4" stroke="#7B8190" stroke-width="2"/><text x="755.0" y="478.8" font-size="14" font-weight="bold" fill="#1C2433" text-anchor="middle">Redis — message bus</text><text x="755.0" y="497.0" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">connection streams · detector inboxes · advice requests · alerts · flow index · health heartbeats</text><rect x="300" y="590" width="250" height="150" rx="10" fill="#FFF1E3" stroke="#CF7A22" stroke-width="2"/><text x="425.0" y="642.6" font-size="14" font-weight="bold" fill="#1C2433" text-anchor="middle">Snort 3</text><text x="425.0" y="660.8" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">same packets</text><text x="425.0" y="679.0" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">42 project rules +</text><text x="425.0" y="697.2" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">~4,000 community rules</text><rect x="615" y="590" width="595" height="150" rx="10" fill="#FFF1E3" stroke="#CF7A22" stroke-width="2"/><text x="912.5" y="642.6" font-size="14" font-weight="bold" fill="#1C2433" text-anchor="middle">Snort bridge (correlator)</text><text x="912.5" y="660.8" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">links each Snort alert to its connection (flow index)</text><text x="912.5" y="679.0" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">asks the AI detectors for their verdict on it</text><text x="912.5" y="697.2" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">→ Confirmed (both) · Disputed (Snort only) · AI only</text><rect x="1300" y="150" width="260" height="120" rx="10" fill="#E8F6EC" stroke="#2C9152" stroke-width="2"/><text x="1430.0" y="196.7" font-size="14" font-weight="bold" fill="#1C2433" text-anchor="middle">Django API</text><text x="1430.0" y="214.9" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">REST + WebSocket</text><text x="1430.0" y="233.1" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">cookie login · CSRF guard</text><rect x="1300" y="330" width="260" height="170" rx="10" fill="#E8F6EC" stroke="#2C9152" stroke-width="2"/><text x="1430.0" y="383.5" font-size="14" font-weight="bold" fill="#1C2433" text-anchor="middle">Next.js dashboard</text><text x="1430.0" y="401.7" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">Overview · Alerts · Detectors</text><text x="1430.0" y="419.9" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">Test with recordings</text><text x="1430.0" y="438.1" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">Results</text><text x="1430.0" y="456.3" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">health · false-alarm panel</text><rect x="1300" y="590" width="260" height="150" rx="10" fill="#E8F6EC" stroke="#2C9152" stroke-width="2"/><text x="1430.0" y="642.6" font-size="14" font-weight="bold" fill="#1C2433" text-anchor="middle">Alert journal</text><text x="1430.0" y="660.8" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">logs/journal/ (one year)</text><text x="1430.0" y="679.0" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">false alarms per</text><text x="1430.0" y="697.2" font-size="14" font-weight="normal" fill="#1C2433" text-anchor="middle">1,000 connections</text><path d="M230,420 L262,420 L262,240 L300,240" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><rect x="232.5" y="319.5" width="59.00000000000001" height="20.25" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="262" y="334.4" font-size="12.5" font-weight="normal" fill="#5B6475" text-anchor="middle">packets</text><path d="M230,470 L262,470 L262,665 L300,665" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><rect x="232.5" y="564.5" width="59.00000000000001" height="20.25" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="262" y="579.4" font-size="12.5" font-weight="normal" fill="#5B6475" text-anchor="middle">packets</text><path d="M550,240 L615,240" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><rect x="559.5" y="211.5" width="45.0" height="20.25" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="582" y="226.4" font-size="12.5" font-weight="normal" fill="#5B6475" text-anchor="middle">flows</text><path d="M795,240 L860,240" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><rect x="798.5" y="211.5" width="59.00000000000001" height="20.25" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="828" y="226.4" font-size="12.5" font-weight="normal" fill="#5B6475" text-anchor="middle">inboxes</text><path d="M425,320 L425,450" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><rect x="357.0" y="375.5" width="136.0" height="20.25" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="425" y="390.4" font-size="12.5" font-weight="normal" fill="#5B6475" text-anchor="middle">flows + flow index</text><path d="M960,415 L960,450" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><rect x="899.0" y="421.5" width="52.00000000000001" height="20.25" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="925" y="436.4" font-size="12.5" font-weight="normal" fill="#5B6475" text-anchor="middle">alerts</text><path d="M550,665 L615,665" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><rect x="556.0" y="636.5" width="52.00000000000001" height="20.25" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="582" y="651.4" font-size="12.5" font-weight="normal" fill="#5B6475" text-anchor="middle">alerts</text><path d="M760,590 L760,516" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><rect x="709.5" y="542.5" width="101.00000000000001" height="20.25" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="760" y="557.4" font-size="12.5" font-weight="normal" fill="#5B6475" text-anchor="middle">linked alerts</text><path d="M1120,590 L1120,415" fill="none" stroke="#4A5263" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#head)" marker-end="url(#head)"/><rect x="1059.0" y="534.0" width="122.00000000000001" height="36.5" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="1120" y="549.2" font-size="12.5" font-weight="normal" fill="#5B6475" text-anchor="middle">verdict on</text><text x="1120" y="565.5" font-size="12.5" font-weight="normal" fill="#5B6475" text-anchor="middle">this connection?</text><path d="M1210,470 L1262,470 L1262,210 L1300,210" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><rect x="1239.5" y="319.5" width="45.0" height="20.25" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="1262" y="334.4" font-size="12.5" font-weight="normal" fill="#5B6475" text-anchor="middle">reads</text><path d="M1430,270 L1430,330" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><rect x="1393.5" y="289.5" width="73.0" height="20.25" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="1430" y="304.4" font-size="12.5" font-weight="normal" fill="#5B6475" text-anchor="middle">live feed</text><path d="M1210,497 L1282,497 L1282,665 L1300,665" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><rect x="1256.0" y="569.5" width="52.00000000000001" height="20.25" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="1282" y="584.4" font-size="12.5" font-weight="normal" fill="#5B6475" text-anchor="middle">alerts</text><rect x="40" y="805" width="1170" height="215" rx="14" fill="none" stroke="#7E55B8" stroke-width="1.6" stroke-dasharray="7 5"/><rect x="54" y="794" width="422.7" height="22" rx="4" fill="#FFFFFF"/><text x="62" y="809.5" font-size="13" font-weight="bold" fill="#7E55B8" text-anchor="start">Offline: training the detectors (scripts/live_detectors/)</text><rect x="65" y="845" width="195" height="140" rx="10" fill="#F4EEFA" stroke="#7E55B8" stroke-width="2"/><text x="162.5" y="902.2" font-size="13.5" font-weight="bold" fill="#1C2433" text-anchor="middle">Attack recordings</text><text x="162.5" y="919.7" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle">CSE-CIC-IDS2018</text><text x="162.5" y="937.3" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle">CICIDS2017 (raw packets)</text><rect x="293" y="845" width="195" height="140" rx="10" fill="#F4EEFA" stroke="#7E55B8" stroke-width="2"/><text x="390.5" y="902.2" font-size="13.5" font-weight="bold" fill="#1C2433" text-anchor="middle">Same flow meter</text><text x="390.5" y="919.7" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle">connections measured</text><text x="390.5" y="937.3" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle">exactly as live</text><path d="M260,915 L293,915" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><rect x="521" y="845" width="195" height="140" rx="10" fill="#F4EEFA" stroke="#7E55B8" stroke-width="2"/><text x="618.5" y="893.4" font-size="13.5" font-weight="bold" fill="#1C2433" text-anchor="middle">train.py</text><text x="618.5" y="910.9" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle">earliest 80% to learn</text><text x="618.5" y="928.5" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle">latest 20% to test</text><text x="618.5" y="946.0" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle">K-Means + 5 classifiers</text><path d="M488,915 L521,915" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><rect x="749" y="845" width="195" height="140" rx="10" fill="#F4EEFA" stroke="#7E55B8" stroke-width="2"/><text x="846.5" y="893.4" font-size="13.5" font-weight="bold" fill="#1C2433" text-anchor="middle">Promotion gate</text><text x="846.5" y="910.9" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle">installed only if</text><text x="846.5" y="928.5" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle">not worse on the</text><text x="846.5" y="946.0" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle">same test flows</text><path d="M716,915 L749,915" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><rect x="977" y="845" width="195" height="140" rx="10" fill="#F4EEFA" stroke="#7E55B8" stroke-width="2"/><text x="1074.5" y="902.2" font-size="13.5" font-weight="bold" fill="#1C2433" text-anchor="middle">models/live/</text><text x="1074.5" y="919.7" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle">3 detectors</text><text x="1074.5" y="937.3" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle">+ SHA256SUMS</text><path d="M944,915 L977,915" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><path d="M1172,845 L1172,772 L1236,772 L1236,300 L1210,300" fill="none" stroke="#4A5263" stroke-width="2" marker-end="url(#head)"/><rect x="954.0" y="753.0" width="192.00000000000003" height="36.5" rx="4" fill="#FFFFFF" opacity="0.92"/><text x="1050" y="768.2" font-size="12.5" font-weight="normal" fill="#5B6475" text-anchor="middle">detectors loaded at start,</text><text x="1050" y="784.5" font-size="12.5" font-weight="normal" fill="#5B6475" text-anchor="middle">checksum-verified</text><rect x="1300" y="805" width="260" height="215" rx="14" fill="none" stroke="#7E55B8" stroke-width="1.6" stroke-dasharray="7 5"/><rect x="1314" y="794" width="89.0" height="22" rx="4" fill="#FFFFFF"/><text x="1322" y="809.5" font-size="13" font-weight="bold" fill="#7E55B8" text-anchor="start">Operations</text><text x="1430" y="872.9" font-size="13.5" font-weight="bold" fill="#1C2433" text-anchor="middle">systemd: one unit per service</text><text x="1430" y="890.4" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle">restart on failure · no root</text><text x="1430" y="908.0" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle">(capture: CAP_NET_RAW only)</text><text x="1430" y="925.5" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle"></text><text x="1430" y="943.1" font-size="13.5" font-weight="bold" fill="#1C2433" text-anchor="middle">nids health every minute</text><text x="1430" y="960.6" font-size="13.5" font-weight="normal" fill="#1C2433" text-anchor="middle">logs → journald</text></svg>