# Counselor NIDS dashboard in containers.
#
#   docker-compose run --rm api python manage.py createsuperuser    # once: dashboard login
#   docker-compose up                                               # dashboard on http://localhost:3000
#
# The dashboard tests the live detectors (models/live/) on recordings in data/pcap/; the API
# runs the services itself. Snort is not in the image (Debian has no package), so tests run
# with the ML only. To monitor a network, run on the host instead: deploy/install-systemd.sh.

x-nids: &nids
  build:
    context: .
    dockerfile: docker/api.Dockerfile
  image: counselor-nids
  environment:
    NIDS_REDIS_URL: redis://redis:6379/0
  volumes:
    - ./models:/app/models
    - ./data:/app/data
    - ./results:/app/results
  depends_on:
    - redis

services:
  redis:
    image: redis:7-alpine

  # --- web stack (default) ---
  api:
    <<: *nids
    working_dir: /app/backend
    entrypoint: []
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput -v 0 && daphne -b 0.0.0.0 -p 8000 config.asgi:application"]
    environment:
      NIDS_REDIS_URL: redis://redis:6379/0
      NIDS_ROOT: /app
      DJANGO_DB_PATH: /db/db.sqlite3
      DJANGO_DEBUG: "false"
      # put DJANGO_SECRET_KEY=<random 50 chars> in a .env file next to this one
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env (python3 -c "import secrets; print(secrets.token_urlsafe(50))")}
      # plain http on localhost; set to "true" behind an HTTPS proxy
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./results:/app/results
      - api-db:/db
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      dockerfile: ../docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  api-db:
