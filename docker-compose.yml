# Counselors-based NIDS.
#
#   docker-compose run --rm train                                   # once: train detectors (needs data/raw)
#   docker-compose run --rm api python manage.py createsuperuser    # once: dashboard login
#   docker-compose up                                               # dashboard on http://localhost:3000
#
# The dashboard starts and stops replays itself (the API runs the services).
# Without the web UI:  docker-compose --profile headless up redis observer detector1 detector2 extractor monitor
#
# Models are trained inside the image so they match its scikit-learn version.

x-nids: &nids
  build: .
  image: counselor-nids
  environment:
    NIDS_REDIS_URL: redis://redis:6379/0
  volumes:
    - ./models:/app/models
    - ./data:/app/data
    - ./results:/app/results
  depends_on:
    - redis

services:
  redis:
    image: redis:7-alpine

  # --- web stack (default) ---
  api:
    <<: *nids
    working_dir: /app/backend
    entrypoint: []
    command: ["sh", "-c", "python manage.py migrate --noinput && daphne -b 0.0.0.0 -p 8000 config.asgi:application"]
    environment:
      NIDS_REDIS_URL: redis://redis:6379/0
      NIDS_ROOT: /app
      DJANGO_DB_PATH: /db/db.sqlite3
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production-please-32+chars}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./results:/app/results
      - api-db:/db
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  # --- one-off ---
  train:
    <<: *nids
    profiles: [setup]
    environment:
      NIDS_DATA_DIR: /app/data/raw
    command: ["train", "scenario2", "--fraction", "0.05",
              "--models", "/app/models", "--replay", "/app/data/replay/scenario2.csv"]

  # --- headless stack (no web UI) ---
  observer:
    <<: *nids
    profiles: [headless]
    command: ["observe"]

  detector1:
    <<: *nids
    profiles: [headless]
    command: ["detect", "/app/models/detector1.joblib", "--sources", "cicids2017", "--cross-check"]

  detector2:
    <<: *nids
    profiles: [headless]
    command: ["detect", "/app/models/detector2.joblib", "--sources", "cicids2017", "--cross-check"]

  extractor:
    <<: *nids
    profiles: [headless]
    command: ["extract", "/app/data/replay/scenario2.csv", "--source", "cicids2017",
              "--wait-for", "2", "--rate", "2000"]
    restart: "no"

  monitor:
    <<: *nids
    profiles: [headless]
    command: ["monitor", "--interval", "5"]

volumes:
  api-db:
