# Counselor NIDS in containers — the same on Linux, macOS and Windows.
#
#   docker compose up --build        # first run: builds the images, then serves
#   docker compose up                # afterwards
#   -> dashboard on http://localhost:3000   (login: admin / admin — change it)
#
# This runs the whole dashboard and the recording tests, with Snort as a counselor
# (Snort 3 is compiled into the API image). Open "Test with recordings" to play the
# bundled attacks through the AI *and* Snort together.
#
# The first build compiles Snort from source and can take 10-20 minutes. After that
# it is cached.
#
# Live capture of a real network card is NOT done here: a container cannot reliably
# reach the host's Wi-Fi/Ethernet on macOS or Windows. For live monitoring, run on a
# Linux host with ./start.sh live <interface> or deploy/install-systemd.sh
# (see docs/deployment.md). Docker gives everyone the identical setup and the full
# recording-based tests, including Snort.

services:
  redis:
    image: redis:7-alpine

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: counselor-nids
    working_dir: /app/backend
    entrypoint: ["/usr/local/bin/entrypoint.api.sh"]
    environment:
      NIDS_REDIS_URL: redis://redis:6379/0
      NIDS_ROOT: /app
      DJANGO_DB_PATH: /db/db.sqlite3
      DJANGO_DEBUG: "false"
      # A random secret is generated and kept in the db volume on first run.
      # Set DJANGO_SECRET_KEY in a .env file to pin your own.
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      # The dashboard login, created on first run. Change the password after signing in.
      DJANGO_SUPERUSER_USERNAME: ${NIDS_ADMIN_USER:-admin}
      DJANGO_SUPERUSER_PASSWORD: ${NIDS_ADMIN_PASSWORD:-admin}
      # plain http on localhost; set to "true" behind an HTTPS proxy
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./results:/app/results
      - api-db:/db
    ports:
      - "8000:8000"
    depends_on:
      - redis

  web:
    build:
      context: ./frontend
      dockerfile: ../docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  api-db:
