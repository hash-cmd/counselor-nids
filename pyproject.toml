[project]
name = "nids"
version = "0.1.0"
description = "Counselors-based network intrusion detection system (reproduction of Quincozes et al., 2019)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "joblib",
    "matplotlib",
]

[project.optional-dependencies]
service = ["redis[hiredis]"]
live = ["redis[hiredis]", "cicflowmeter"]
web = [
    "redis[hiredis]", "django", "djangorestframework", "djangorestframework-simplejwt",
    "django-cors-headers", "channels", "daphne", "python-decouple",
]
dev = ["pytest", "jupyterlab", "nbconvert", "fakeredis", "nids[web]"]

[project.scripts]
nids = "nids.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyrefly]
search-path = ["src", ".", "backend"]
