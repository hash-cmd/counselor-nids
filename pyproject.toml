[project]
name = "nids"
version = "0.1.0"
description = "Network intrusion detection: counselor-based ML detectors and Snort on live traffic"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "joblib",
]

[project.optional-dependencies]
live = ["redis[hiredis]", "cicflowmeter"]
web = [
    "redis[hiredis]", "django", "djangorestframework", "djangorestframework-simplejwt",
    "django-cors-headers", "channels", "daphne", "python-decouple", "whitenoise",
]
# retraining and testing the live detectors (scripts/live_detectors/)
train = ["fakeredis", "nids[live]"]

[project.scripts]
nids = "nids.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyrefly]
search-path = ["src", ".", "backend"]
