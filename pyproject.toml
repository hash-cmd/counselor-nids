[project]
name = "nids"
version = "0.1.0"
description = "Counselors-based network intrusion detection system (reproduction of Quincozes et al., 2019)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "joblib",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "jupyterlab", "nbconvert"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
